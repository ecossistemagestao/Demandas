<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Disponibilidade da Daniela</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #080808;
  --ink-soft: #1b1b1f;
  --red: #E11020;
  --red-tint: rgba(225, 16, 32, 0.055);
  --paper: #F5F5F5;
  --white: #ffffff;
  --mute: #5a5a60;
  --line: #dcdce0;
  --line-strong: #bdbdc3;
  --ok: #1d8f4e;
  --display: "Bebas Neue", Impact, "Arial Narrow", sans-serif;
  --body: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --row: 26px;
  color-scheme: light;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--body);
  font-size: 16px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
  background: var(--ink); z-index: 40;
}
.wrap {
  max-width: 880px;
  margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* Abertura */
header.top { background: var(--ink); color: var(--paper); }
header.top .wrap { padding-block: 44px 48px; }
.eyebrow {
  margin: 0 0 16px;
  font-size: 11px; font-weight: 600; letter-spacing: 0.18em; text-transform: uppercase;
  color: var(--red);
}
h1 {
  font-family: var(--display); font-weight: 400;
  font-size: clamp(46px, 10vw, 80px); line-height: 0.94; letter-spacing: 0.012em;
  margin: 0 0 20px; text-wrap: balance;
}
.lede { max-width: 56ch; margin: 0; color: #cfcfd4; font-size: 17px; line-height: 1.65; }

/* Navegação fixa */
.bar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30;
  background: var(--ink); border-top: 1px solid #26262b; border-bottom: 1px solid #26262b;
}
.bar-in { display: flex; align-items: stretch; justify-content: space-between; gap: 16px; }
.brand {
  display: none; align-self: center;
  font-family: var(--display); font-size: 20px; letter-spacing: 0.06em; color: var(--paper); white-space: nowrap;
}
.links { display: flex; flex: 1; justify-content: space-between; gap: 4px; overflow-x: auto; scrollbar-width: none; }
.links::-webkit-scrollbar { display: none; }
.links a {
  position: relative; display: block; padding: 15px 4px 13px;
  font-size: 11px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase;
  color: #9d9da4; text-decoration: none; white-space: nowrap;
  transition: color .2s ease;
}
.links a::after {
  content: ""; position: absolute; left: 4px; right: 4px; bottom: 0; height: 2px;
  background: var(--red); transform: scaleX(0); transform-origin: left; transition: transform .25s ease;
}
.links a:hover { color: var(--paper); }
.links a.on { color: var(--paper); }
.links a.on::after { transform: scaleX(1); }
@media (min-width: 640px) {
  .brand { display: block; }
  .links { flex: 0 0 auto; gap: 28px; }
}

/* Seções */
section { border-bottom: 1px solid var(--line); scroll-margin-top: 56px; }
section .wrap { padding-block: 44px; }
h2 {
  font-family: var(--display); font-weight: 400;
  font-size: 40px; letter-spacing: 0.03em; line-height: 1; margin: 0 0 8px;
}
.sub { margin: 0 0 28px; color: var(--mute); max-width: 62ch; }
h3.lab {
  margin: 0 0 8px;
  font-size: 11px; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; color: var(--red);
}

/* Status */
.now {
  display: inline-flex; align-items: center; gap: 10px; flex-wrap: wrap;
  margin: 0 0 22px; padding: 8px 14px 8px 12px;
  background: var(--white); border: 1px solid var(--line); font-size: 13px;
}
.now .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--line-strong); flex: none; }
.now.live .dot { background: var(--ok); box-shadow: 0 0 0 3px rgba(29, 143, 78, 0.18); }
.now b { font-weight: 600; }
.now span.rest { color: var(--mute); }

/* Tabela semanal */
.tbl { border-top: 1px solid var(--ink); }
.tr {
  display: grid; grid-template-columns: 11rem repeat(3, minmax(0, 1fr)); gap: 0 24px; align-items: start;
  padding: 20px 10px; border-bottom: 1px solid var(--line);
  transition: background-color .2s ease;
}
.tr.head { padding: 12px 10px; }
.tr:not(.head):hover { background: var(--white); }
.tr.today { background: var(--red-tint); }
.tr.today:hover { background: rgba(225, 16, 32, 0.09); }
.th { font-size: 11px; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; color: var(--red); }
.dn { display: flex; align-items: center; flex-wrap: wrap; gap: 4px 10px; font-family: var(--display); font-size: 28px; line-height: 1; letter-spacing: 0.03em; }
.hoje {
  font-family: var(--body); font-size: 10px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase;
  background: var(--red); color: #fff; padding: 3px 7px 2px; line-height: 1.3;
}
.tot { display: block; margin-top: 8px; font-size: 12px; color: var(--mute); font-variant-numeric: tabular-nums; }
.tot b { color: var(--ink); font-weight: 600; }
.td { min-width: 0; }
.pl { display: none; margin-bottom: 4px; font-size: 10px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: var(--red); }
.tv { display: block; font-size: 17px; font-weight: 500; line-height: 1.3; font-variant-numeric: tabular-nums; }
.tl { display: block; margin-top: 2px; font-size: 12px; color: var(--mute); font-variant-numeric: tabular-nums; }
.meter { display: block; height: 3px; margin-top: 10px; background: var(--line); }
.meter i { display: block; height: 100%; background: var(--ink); }
@media (max-width: 640px) {
  .tr.head { display: none; }
  .tr { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px 12px; padding: 18px 4px; }
  .td-day { grid-column: 1 / -1; display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  .tot { margin-top: 0; }
  .pl { display: block; }
  .tv { font-size: 14px; }
}

/* Prazos */
.levels { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--ink); }
.lv {
  display: grid; grid-template-columns: minmax(0, 13.5rem) minmax(0, 1fr); gap: 6px 24px;
  padding: 18px 8px; border-bottom: 1px solid var(--line);
  transition: background-color .2s ease;
}
.lv:hover { background: var(--white); }
.lv-k { display: flex; align-items: center; gap: 14px; }
.lv-name { font-family: var(--display); font-size: 26px; line-height: 1.05; letter-spacing: 0.03em; }
.bars { display: inline-flex; align-items: flex-end; gap: 3px; height: 18px; flex: none; }
.bars i { display: block; width: 5px; background: var(--line-strong); }
.bars i:nth-child(1) { height: 7px; }
.bars i:nth-child(2) { height: 12px; }
